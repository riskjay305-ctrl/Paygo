<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="60" fill="#fbbf24" opacity="0.1"/>
  <circle cx="1100" cy="550" r="80" fill="#fbbf24" opacity="0.08"/>
  
  <!-- Main title -->
  <text x="600" y="240" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">PAYgO Limited</text>
  
  <!-- Subtitle -->
  <text x="600" y="330" font-size="32" fill="#fbbf24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Smart Digital Financial Platform</text>
  
  <!-- Description line -->
  <text x="600" y="390" font-size="20" fill="#cbd5e1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Register • Transfer • Withdraw • Secure</text>
  
  <!-- Divider line -->
  <line x1="150" y1="430" x2="1050" y2="430" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
  
  <!-- Feature icons/text -->
  <text x="250" y="520" font-size="16" fill="#e2e8f0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">💳 Wallet</text>
  <text x="450" y="520" font-size="16" fill="#e2e8f0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">🔄 Transfer</text>
  <text x="600" y="520" font-size="16" fill="#e2e8f0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">💰 Withdraw</text>
  <text x="750" y="520" font-size="16" fill="#e2e8f0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">🔒 Secure</text>
  <text x="950" y="520" font-size="16" fill="#e2e8f0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">⚡ Fast</text>
</svg>
